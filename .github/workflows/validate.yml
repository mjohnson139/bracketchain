name: validate

# Gates writes and proves the build. Runs on pull requests (the merge gate) and
# on pushes to main (a record on the protected branch). Any change that adds or
# alters ledger records must pass the full audit (signatures, schema, deadlines,
# commitment↔reveal hashes), the unit suite, the determinism check, and the
# browser end-to-end flow. This never deploys.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One validation per ref; a newer push cancels an in-flight run.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Unit tests (crypto, merkle, scoring, determinism, verify flow)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Audit ledger (signatures, schema, deadlines)
        run: npm run verify:ledger

      - name: Determinism check (state build is byte-stable)
        run: |
          npm run build:state -- ledger /tmp/state-a
          npm run build:state -- ledger /tmp/state-b
          if ! cmp -s /tmp/state-a/game.sqlite /tmp/state-b/game.sqlite; then
            echo "Non-deterministic state build: sqlite differs between runs" >&2
            exit 1
          fi
          echo "State build is byte-identical across runs."

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end flow (join, preview commitment, verify proof in browser)
        run: npm run e2e
